<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Controle de Condicional</title>

<style>
body{margin:0;font-family:Arial;background:#0b0b0b;color:#fff}

header{
padding:15px;
font-size:24px;
color:#ff2a2a;
border-bottom:2px solid #ff2a2a
}

#inicio{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
}

#inicio img{
width:300px;
opacity:0.2;
}

#inicio button{
padding:15px;
background:#ff2a2a;
color:#fff;
border:none;
cursor:pointer;
margin-top:20px;
}

.container{display:flex;height:calc(100vh - 60px)}

.left{width:320px;border-right:2px solid #ff2a2a;padding:10px}
.right{flex:1;padding:15px}

input{
width:100%;
padding:10px;
margin-bottom:10px;
background:#111;
border:1px solid #ff2a2a;
color:#fff
}

button{padding:8px;margin:3px;cursor:pointer}

.modo{border:1px solid #ff2a2a;padding:6px;cursor:pointer}
.ativo{background:#ff2a2a}

.cod{
border:1px solid #ff2a2a;
padding:6px;
margin:4px 0;
display:flex;
justify-content:space-between
}

.copy{
background:#ff2a2a;
font-size:10px;
padding:3px;
cursor:pointer
}

.devolvido{
color:#00c853;
text-decoration:line-through
}

#app{display:none}
</style>
</head>

<body>

<header>CONTROLE DE CONDICIONAL</header>

<!-- TELA INICIAL -->
<div id="inicio">
<img src="logo.png">
<button onclick="abrirSistema()">ENTRAR</button>
</div>

<!-- SISTEMA -->
<div id="app" class="container">

<div class="left">

<input id="nome" placeholder="Nome">
<input id="cpf" placeholder="CPF">
<input id="telefone" placeholder="Telefone">

<button onclick="criarCliente()">Criar Cliente</button>

<input id="buscarCpf" placeholder="Buscar CPF">
<button onclick="buscarCliente()">Buscar</button>

<div id="listaClientes"></div>

</div>

<div class="right">

<h2 id="clienteNome"></h2>

<button onclick="novoCond()">Novo Condicional</button>
<button onclick="finalizar()">Finalizar</button>
<button onclick="fechar()">Fechar</button>

<hr>

<span id="addBtn" class="modo ativo">ADICIONAR</span>
<span id="retBtn" class="modo">RETIRAR</span>

<input id="scan" placeholder="Bipar código + ENTER">

<button onclick="imprimirEntrega()">Imprimir Entrega</button>
<button onclick="imprimirFinal()">Imprimir Final</button>

<h3 id="total">Total: 0</h3>
<div id="lista"></div>

</div>
</div>

<script>

let clientes = JSON.parse(localStorage.getItem("clientes")||"[]")

let clienteAtual=null
let condAtual=null
let modo="add"

// ABRIR SISTEMA
function abrirSistema(){
document.getElementById("inicio").style.display="none"
document.getElementById("app").style.display="flex"
renderClientes()
}

// FECHAR
function fechar(){
clienteAtual=null
condAtual=null
document.getElementById("app").style.display="none"
document.getElementById("inicio").style.display="flex"
}

// SALVAR
function salvar(){
localStorage.setItem("clientes",JSON.stringify(clientes))
}

// CRIAR CLIENTE
function criarCliente(){
let n=nome.value.trim()
let c=cpf.value.trim()
let t=telefone.value.trim()

if(!n||!c)return alert("Preencha")

clientes.push({nome:n,cpf:c,telefone:t,conds:[]})

salvar()
renderClientes()

nome.value=""
cpf.value=""
telefone.value=""
}

// BUSCAR CPF
function buscarCliente(){
let cpfBusca=buscarCpf.value.trim()
let i=clientes.findIndex(x=>x.cpf===cpfBusca)

if(i===-1)return alert("Não encontrado")

abrirCliente(i)
}

// LISTA
function renderClientes(){
listaClientes.innerHTML=""

clientes.forEach((c,i)=>{
let d=document.createElement("div")
d.innerHTML=`${c.nome}<br>CPF:${c.cpf}<br>Tel:${c.telefone}<hr>`
d.onclick=()=>abrirCliente(i)
listaClientes.appendChild(d)
})
}

// ABRIR CLIENTE
function abrirCliente(i){
clienteAtual=clientes[i]
condAtual=null

clienteNome.innerText=
`${clienteAtual.nome} | CPF:${clienteAtual.cpf} | Tel:${clienteAtual.telefone}`

render()
}

// NOVO COND
function novoCond(){
if(!clienteAtual)return alert("Selecione cliente")

condAtual={data:new Date().toLocaleDateString(),itens:[],final:false}

clienteAtual.conds.push(condAtual)

salvar()
render()
}

// MODO
addBtn.onclick=()=>{modo="add";addBtn.classList.add("ativo");retBtn.classList.remove("ativo")}
retBtn.onclick=()=>{modo="ret";retBtn.classList.add("ativo");addBtn.classList.remove("ativo")}

// LEITOR
scan.addEventListener("keydown",e=>{
if(e.key==="Enter"){

let cod=scan.value.trim()
scan.value=""

if(!condAtual)return alert("Crie condicional")

if(modo==="add"){
condAtual.itens.push({codigo:cod,status:"pendente"})
}else{
let item=condAtual.itens.find(x=>x.codigo===cod && x.status==="pendente")
if(!item)return alert("Não encontrado")
item.status="devolvido"
}

salvar()
render()
}
})

// RENDER
function render(){
lista.innerHTML=""

if(!condAtual){
total.innerText="Total: 0"
return
}

condAtual.itens.forEach(i=>{
let d=document.createElement("div")
d.className="cod"

d.innerHTML=`
<span class="${i.status==="devolvido"?"devolvido":""}">
${i.codigo}
</span>
<span class="copy" onclick="navigator.clipboard.writeText('${i.codigo}')">
copiar
</span>
`

lista.appendChild(d)
})

let pendentes=condAtual.itens.filter(x=>x.status==="pendente").length
total.innerText="Pendentes: "+pendentes
}

// FINALIZAR
function finalizar(){
if(!condAtual)return
condAtual.final=true
salvar()
alert("Finalizado")
}

// IMPRESSÃO
function imprimirEntrega(){
let txt=`CONDICIONAL\n\nCliente: ${clienteAtual.nome}\n\n`
condAtual.itens.forEach(i=>txt+=i.codigo+"\n")
txt+=`\n\nAssinatura: ____________________`
imprimir(txt)
}

function imprimirFinal(){
let txt=`FINAL\n\nCliente: ${clienteAtual.nome}\n\n`
condAtual.itens.filter(i=>i.status==="pendente")
.forEach(i=>txt+=i.codigo+"\n")
imprimir(txt)
}

function imprimir(t){
let w=window.open()
w.document.write("<pre>"+t+"</pre>")
w.print()
}

</script>

</body>
</html>
