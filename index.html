<title>Controle de Condicional</title>

.ativo{background:#ff2a2a}

.aberto{color:red}

#logoBox{
position:absolute;
top:0;
left:0;

height:100%;

opacity:0.05;
}

#logoBox img{width:60%}

#sistema{display:none}
</style>
</head>
