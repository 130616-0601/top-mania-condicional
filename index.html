<script>

let clientes = JSON.parse(localStorage.getItem("clientes")||"[]")
let clienteAtual=null
let condAtual=null
let modo='add'

function salvar(){
localStorage.setItem("clientes",JSON.stringify(clientes))
}

function criarCliente(){
let n=nome.value.trim()
let c=cpf.value.trim()
let t=prompt("Telefone do cliente:")

if(!n||!c)return alert("Preencha")

let existe=clientes.find(x=>x.cpf===c)
if(existe){abrirCliente(existe);return}

let novo={nome:n,cpf:c,telefone:t,conds:[]}
clientes.push(novo)

salvar()
renderClientes()
abrirCliente(novo)

nome.value=""
cpf.value=""
}

function renderClientes(){
listaClientes.innerHTML=""
clientes.forEach(c=>{
let d=document.createElement("div")
d.className="cliente"
d.innerText=c.nome+" ("+c.telefone+")"
d.onclick=()=>abrirCliente(c)
listaClientes.appendChild(d)
})
}

function abrirCliente(c){
clienteAtual=c
condAtual=null
lista.innerHTML=""
total.innerText="Total: 0"

sistema.style.display="block"
clienteNome.innerText=c.nome+" - "+c.telefone

renderHistorico()
}

function fechar(){
clienteAtual=null
condAtual=null
sistema.style.display="none"
}

function novoCond(){
condAtual={data:new Date().toLocaleDateString(),itens:[],final:false}
clienteAtual.conds.push(condAtual)
salvar()
render()
renderHistorico()
}

function renderHistorico(){
historico.innerHTML=""
clienteAtual.conds.forEach(c=>{
let d=document.createElement("div")
d.className=c.final?"finalizado":"aberto"
d.innerText=c.data+" - "+(c.final?"finalizado":"em aberto")
d.onclick=()=>{condAtual=c;render()}
historico.appendChild(d)
})
}

addBtn.onclick=()=>{modo='add';addBtn.classList.add('ativo');retBtn.classList.remove('ativo')}
retBtn.onclick=()=>{modo='ret';retBtn.classList.add('ativo');addBtn.classList.remove('ativo')}

scan.addEventListener("keydown",e=>{
if(e.key==="Enter"){
let c=scan.value.trim()
scan.value=""
processar(c)
}
})

function processar(c){
if(!condAtual)return

if(modo==="add"){
condAtual.itens.push({codigo:c,status:"pendente"})
}else{
let item=condAtual.itens.find(x=>x.codigo===c && x.status==="pendente")
if(!item)return alert("Código não encontrado ou já devolvido")
item.status="devolvido"
}

salvar()
render()
}

function render(){
lista.innerHTML=""

condAtual.itens.forEach(i=>{
let d=document.createElement("div")
d.className="cod"

let cor = i.status==="pendente" ? "#fff" : "#00c853"

d.innerHTML=
"<span style='color:"+cor+"'>"+i.codigo+" ("+i.status+")</span> "+
"<span class='copy' onclick='navigator.clipboard.writeText(\""+i.codigo+"\")'>copiar</span>"

lista.appendChild(d)
})

let pendentes = condAtual.itens.filter(x=>x.status==="pendente").length
total.innerText="Pendentes: "+pendentes
}

function manualAdd(){
let c=prompt("Código")
if(c)processar(c)
}

function manualRet(){
let c=prompt("Código")
if(c){modo='ret';processar(c)}
}

function finalizar(){
condAtual.final=true
salvar()
renderHistorico()
alert("Finalizado")
}

function imprimirEntrega(){
let txt="CONDICIONAL\n\nCliente: "+clienteAtual.nome+"\n\n"
condAtual.itens.forEach(i=>txt+=i.codigo+" - "+i.status+"\n")
txt+="\nAss: ____"
imprimir(txt)
}

function imprimirFinal(){
let txt="FINAL\n\nCliente: "+clienteAtual.nome+"\n\n"
condAtual.itens.forEach(i=>txt+=i.codigo+" - "+i.status+"\n")
imprimir(txt)
}

function imprimir(t){
let w=window.open()
w.document.write("<pre>"+t+"</pre>")
w.print()
}

function buscarCliente(){
let cpfBusca=buscar.value.trim()
let c=clientes.find(x=>x.cpf===cpfBusca)
if(!c)return alert("Não encontrado")
abrirCliente(c)
}

renderClientes()

</script>
