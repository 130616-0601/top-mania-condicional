<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Controle de Condicional</title>

<style>
body{margin:0;font-family:Arial;background:#0b0b0b;color:#fff}
header{padding:15px;font-size:24px;color:#ff2a2a;border-bottom:2px solid #ff2a2a}

.container{display:flex;height:calc(100vh - 60px)}

.left{width:320px;border-right:2px solid #ff2a2a;padding:10px}
.right{flex:1;padding:15px;position:relative}

input{width:100%;padding:10px;margin-bottom:10px;background:#111;border:1px solid #ff2a2a;color:#fff}

button{padding:10px;border:none;cursor:pointer;margin-top:5px}

.btn-red{background:#ff2a2a;color:#fff}
.btn-green{background:#00c853;color:#fff}
.btn-gray{background:#333;color:#fff}

.cliente{
border:1px solid #ff2a2a;
padding:8px;
margin:5px 0;
cursor:pointer;
position:relative;
}

.excluir{
position:absolute;
right:5px;
top:5px;
background:#ff2a2a;
font-size:10px;
padding:2px 5px;
cursor:pointer;
}

.cod{border:1px solid #ff2a2a;padding:6px;margin:4px 0}

.ativo{background:#ff2a2a}

</style>
</head>

<body>

<header>CONTROLE DE CONDICIONAL</header>

<div class="container">

<div class="left">

<input id="nome" placeholder="Nome">
<input id="cpf" placeholder="CPF">
<input id="telefone" placeholder="Telefone">

<button class="btn-red" onclick="criarCliente()">Criar Cliente</button>

<hr>

<div id="listaClientes"></div>

</div>

<div class="right">

<h2 id="clienteNome"></h2>

<button onclick="novoCond()">Novo Condicional</button>
<button onclick="fechar()">Fechar</button>

<hr>

<div id="historico"></div>

<hr>

<input id="scan" placeholder="Digite código + ENTER">

<h3 id="total">Total: 0</h3>
<div id="lista"></div>

</div>

</div>

<script>

let clientes = JSON.parse(localStorage.getItem("clientes") || "[]")

let clienteAtual = null
let condAtual = null

function salvar(){
localStorage.setItem("clientes", JSON.stringify(clientes))
}

// CRIAR CLIENTE
function criarCliente(){
let n = document.getElementById("nome").value
let c = document.getElementById("cpf").value
let t = document.getElementById("telefone").value

if(!n || !c) return alert("Preencha tudo")

let novo = {nome:n, cpf:c, telefone:t, conds:[]}

clientes.push(novo)

salvar()
renderClientes()

}

// LISTAR CLIENTES
function renderClientes(){
let div = document.getElementById("listaClientes")
div.innerHTML = ""

clientes.forEach((c,i)=>{

let el = document.createElement("div")
el.className = "cliente"

el.innerHTML = `
<b>${c.nome}</b><br>
CPF: ${c.cpf}<br>
Tel: ${c.telefone}
<span class="excluir" onclick="excluirCliente(${i})">X</span>
`

el.onclick = ()=> abrirCliente(i)

div.appendChild(el)

})
}

// EXCLUIR CLIENTE
function excluirCliente(i){
if(confirm("Excluir cliente?")){
clientes.splice(i,1)
salvar()
renderClientes()
}
}

// ABRIR CLIENTE
function abrirCliente(i){
clienteAtual = clientes[i]
condAtual = null

document.getElementById("clienteNome").innerText =
clienteAtual.nome + " | CPF: " + clienteAtual.cpf + " | Tel: " + clienteAtual.telefone

renderHistorico()
}

// NOVO CONDICIONAL
function novoCond(){
if(!clienteAtual) return alert("Selecione cliente")

condAtual = {itens:[], data:new Date().toLocaleDateString()}

clienteAtual.conds.push(condAtual)

salvar()
renderHistorico()
render()
}

// HISTÓRICO
function renderHistorico(){
let div = document.getElementById("historico")
div.innerHTML = ""

if(!clienteAtual) return

clienteAtual.conds.forEach((c,i)=>{

let el = document.createElement("div")
el.innerText = c.data

el.onclick = ()=>{
condAtual = c
render()
}

div.appendChild(el)

})
}

// ADICIONAR CÓDIGO
document.getElementById("scan").addEventListener("keydown", e=>{
if(e.key==="Enter"){

if(!condAtual) return alert("Crie um condicional primeiro")

let val = e.target.value
e.target.value=""

condAtual.itens.push(val)

salvar()
render()

}
})

// RENDER LISTA
function render(){
let div = document.getElementById("lista")
div.innerHTML = ""

if(!condAtual) return

condAtual.itens.forEach(c=>{
let el = document.createElement("div")
el.className="cod"
el.innerText=c
div.appendChild(el)
})

document.getElementById("total").innerText =
"Total: "+condAtual.itens.length
}

// FECHAR
function fechar(){
clienteAtual = null
condAtual = null
document.getElementById("clienteNome").innerText = ""
document.getElementById("lista").innerHTML = ""
document.getElementById("historico").innerHTML = ""
}

// INIT
renderClientes()

</script>

</body>
</html>
