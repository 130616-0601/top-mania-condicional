<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Controle de Condicional</title>

<style>
body{margin:0;font-family:Arial;background:#0b0b0b;color:#fff}
header{padding:15px;font-size:28px;color:#ff2a2a;text-align:center;border-bottom:2px solid #ff2a2a}

#inicio{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh}
#inicio h1{color:#ff2a2a;font-size:40px}
#inicio img{width:300px;opacity:0.2;margin:20px}
#inicio button{padding:15px;background:#ff2a2a;color:#fff;border:none;cursor:pointer}

.container{display:flex;height:calc(100vh - 60px)}
.left{width:320px;border-right:2px solid #ff2a2a;padding:10px}
.right{flex:1;padding:15px}

input{width:100%;padding:10px;margin-bottom:10px;background:#111;border:1px solid #ff2a2a;color:#fff}
button{padding:6px;margin:3px;cursor:pointer}

.cliente{border:1px solid #ff2a2a;padding:6px;margin-bottom:5px}
.acoes button{font-size:10px}

.pasta{display:flex;justify-content:space-between;padding:6px;margin:5px 0;cursor:pointer}
.aberto{background:#ff2a2a}
.finalizado{background:#00c853}

.cod{border:1px solid #ff2a2a;padding:6px;margin:4px 0;display:flex;justify-content:space-between}
.copy{background:#ff2a2a;font-size:10px;padding:3px;cursor:pointer}
.devolvido{color:#00c853;text-decoration:line-through}

.modo{border:1px solid #ff2a2a;padding:5px;cursor:pointer}
.ativo{background:#ff2a2a}

#app{display:none}
</style>
</head>

<body>

<header>CONTROLE DE CONDICIONAL</header>

<div id="inicio">
<h1>CONTROLE DE CONDICIONAL</h1>
<img src="logo.png">
<button onclick="abrirSistema()">ENTRAR</button>
</div>

<div id="app" class="container">

<div class="left">

<input id="nome" placeholder="Nome">
<input id="cpf" placeholder="CPF">
<input id="telefone" placeholder="Telefone">

<button onclick="criarCliente()">Criar Cliente</button>

<input id="buscarCpf" placeholder="Buscar CPF">
<button onclick="buscarCliente()">Buscar Cliente</button>

<div id="listaClientes"></div>

</div>

<div class="right">

<h2 id="clienteNome"></h2>

<button onclick="novoCond()">Novo Condicional</button>
<button onclick="finalizar()">Finalizar</button>
<button onclick="fechar()">Fechar</button>

<hr>

<div id="historico"></div>

<hr>

<span id="addBtn" class="modo ativo">ADICIONAR</span>
<span id="retBtn" class="modo">RETIRAR</span>

<input id="scan" placeholder="Bipar código + ENTER">

<button onclick="imprimirEntrega()">🧾 Imprimir Entrega</button>
<button onclick="imprimirFinal()">📄 Imprimir Final</button>

<h3 id="total"></h3>
<div id="lista"></div>

</div>
</div>

<script>

let clientes = JSON.parse(localStorage.getItem("clientes")||"[]")

let clienteAtual=null
let condAtual=null
let modo="add"

function salvar(){
localStorage.setItem("clientes",JSON.stringify(clientes))
}

function abrirSistema(){
inicio.style.display="none"
app.style.display="flex"
renderClientes()
}

function fechar(){
clienteAtual=null
condAtual=null
app.style.display="none"
inicio.style.display="flex"
}

function criarCliente(){
if(!nome.value || !cpf.value) return alert("Preencha")

clientes.push({
nome:nome.value,
cpf:cpf.value,
telefone:telefone.value,
conds:[]
})

salvar()
renderClientes()
}

// BUSCAR CPF
function buscarCliente(){
let cpfBusca = document.getElementById("buscarCpf").value.trim()

let cliente = clientes.find(c => c.cpf == cpfBusca)

if(!cliente){
alert("Cliente não encontrado")
return
}

let index = clientes.indexOf(cliente)
abrirCliente(index)
}

// EDITAR
function editarCliente(i){
let c = clientes[i]

let n = prompt("Nome:", c.nome)
let cpfN = prompt("CPF:", c.cpf)
let t = prompt("Telefone:", c.telefone)

if(!n || !cpfN) return

clientes[i].nome = n
clientes[i].cpf = cpfN
clientes[i].telefone = t

salvar()
renderClientes()
}

// EXCLUIR
function excluirCliente(i){
if(confirm("Excluir cliente?")){
clientes.splice(i,1)
salvar()
renderClientes()
}
}

// LISTA
function renderClientes(){
listaClientes.innerHTML=""

clientes.forEach((c,i)=>{
let d=document.createElement("div")
d.className="cliente"

d.innerHTML=`
<div onclick="abrirCliente(${i})">
<b>${c.nome}</b><br>
CPF:${c.cpf}<br>
Tel:${c.telefone}
</div>

<div class="acoes">
<button onclick="editarCliente(${i})">Editar</button>
<button onclick="excluirCliente(${i})">Excluir</button>
</div>
`

listaClientes.appendChild(d)
})
}

// 🔥 CORREÇÃO PRINCIPAL AQUI
function abrirCliente(i){
clienteAtual = clientes[i]
condAtual = null

clienteNome.innerText=`${clienteAtual.nome} | CPF:${clienteAtual.cpf}`

// limpa tela
lista.innerHTML=""
total.innerText="Pendentes: 0"

renderHistorico()
}

// NOVO COND
function novoCond(){
if(!clienteAtual) return alert("Selecione cliente")

let data=new Date().toLocaleDateString()

let novo={data,itens:[],final:false}

clienteAtual.conds.push(novo)

// 🔒 garante vínculo correto
condAtual = clienteAtual.conds[clienteAtual.conds.length - 1]

salvar()
renderHistorico()
render()
}

// EXCLUIR COND
function excluirCond(i){
if(confirm("Excluir condicional?")){
clienteAtual.conds.splice(i,1)
salvar()
renderHistorico()
render()
}
}

// 🔒 HISTÓRICO ISOLADO
function renderHistorico(){
historico.innerHTML=""

if(!clienteAtual || !clienteAtual.conds) return

clienteAtual.conds.forEach((c,i)=>{
let d=document.createElement("div")

d.className="pasta "+(c.final?"finalizado":"aberto")

d.innerHTML=`
<span>${c.data}</span>
<button onclick="excluirCond(${i})">X</button>
`

d.onclick=()=>{
condAtual = c
render()
}

historico.appendChild(d)
})
}

// MODOS
addBtn.onclick=()=>{modo="add";addBtn.classList.add("ativo");retBtn.classList.remove("ativo")}
retBtn.onclick=()=>{modo="ret";retBtn.classList.add("ativo");addBtn.classList.remove("ativo")}

// LEITOR
scan.addEventListener("keydown",e=>{
if(e.key==="Enter"){
let cod=scan.value
scan.value=""

if(!condAtual) return alert("Crie um condicional")

if(modo==="add"){
condAtual.itens.push({codigo:cod,status:"pendente"})
}else{
let item=condAtual.itens.find(x=>x.codigo===cod && x.status==="pendente")
if(item)item.status="devolvido"
}

salvar()
render()
}
})

// 🔒 RENDER PROTEGIDO
function render(){
lista.innerHTML=""
if(!condAtual || !clienteAtual) return

condAtual.itens.forEach(i=>{
let d=document.createElement("div")
d.className="cod"

d.innerHTML=`
<span class="${i.status==="devolvido"?"devolvido":""}">
${i.codigo}
</span>
<span class="copy" onclick="navigator.clipboard.writeText('${i.codigo}')">
copiar
</span>
`

lista.appendChild(d)
})

let pendentes=condAtual.itens.filter(x=>x.status==="pendente").length
total.innerText="Pendentes: "+pendentes
}

// FINALIZAR
function finalizar(){
condAtual.final=true
salvar()
renderHistorico()
alert("Finalizado")
}

// IMPRESSÃO
function imprimirEntrega(){
if(!condAtual)return

let txt="CONDICIONAL\n\nCliente: "+clienteAtual.nome+"\n\n"
condAtual.itens.forEach(i=>txt+=i.codigo+"\n")
txt+="\n\nAssinatura: _____________________"

imprimir(txt)
}

function imprimirFinal(){
if(!condAtual)return

let txt="FINAL\n\nCliente: "+clienteAtual.nome+"\n\n"
condAtual.itens.filter(i=>i.status==="pendente")
.forEach(i=>txt+=i.codigo+"\n")

imprimir(txt)
}

function imprimir(t){
let w=window.open("", "PRINT")
w.document.write("<pre>"+t+"</pre>")
w.document.close()
w.focus()
w.print()
}

renderClientes()

</script>

</body>
</html>
